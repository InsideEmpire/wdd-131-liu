<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>

    <meta name="description" content="An interactive JavaScript character card with attack and level up features. Built with HTML, CSS, and JavaScript.">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card | Interactive JS Project">
    <meta property="og:description" content="Interactive character card with level and health system built in JavaScript.">
    <meta property="og:url" content="https://your-site.com/character-card">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/en/0/09/Skibidi_toilet_screenshot.webp">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card | Interactive JS Project">
    <meta name="twitter:description" content="Interactive character card with dynamic stats using JavaScript.">
    <meta name="twitter:image" content="https://upload.wikimedia.org/wikipedia/en/0/09/Skibidi_toilet_screenshot.webp">

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>
</head>
<body>
    <div class="card">
    
        <img class="image" src="" alt="Character Image">

        <div class="name"></div>

        <div class="stats">
            <p class="stats-class"></p>
            <p class="stats-level"></p>
            <p class="stats-hp"></p>
        </div>

        <div class="buttons">
            <button class="button-attacked">Attack</button>
            <button class="button-levelup">Level Up</button>
        </div>

    </div>
</body>
</html>
