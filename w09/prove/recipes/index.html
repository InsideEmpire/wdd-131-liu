<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe Book</title>

    <link rel="stylesheet" href="css/index.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Delicious homemade recipes.">
    <meta property="og:url" content="https://yoursite.com">
    <meta property="og:image" content="social-preview-image.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Delicious homemade recipes">
    <meta name="twitter:image" content="social-preview-image.png">

    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

</head>

<body>

    <header class="header">

        <div class="logo-area">
            <img src="images/recipe-book.png" alt="recipe logo">
            <h1>Recipe Book</h1>
        </div>

        <div class="search">
            <input type="text" placeholder="Find a Recipe">
            <img src="images/search.svg" alt="search">
        </div>

    </header>

    <main>

        <section class="recipe">

            <img src="images/apple-crisp.jpg" alt="apple crisp">

            <div class="recipe-info">

                <input type="button" value="Dessert">

                <h2>Apple Crisp</h2>

                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p class="description">
                    A warm apple dessert with cinnamon and crunchy topping.
                </p>

            </div>

        </section>

    </main>

    <footer>

        <p>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        </p>

        <div class="social">

            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->

            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>

        </div>

    </footer>

</body>

</html>
